name: iOS Tweak Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 配置 Theos 环境
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        
    - name: 3. 配置 SDK
      run: |
        git clone https://github.com/theos/sdks.git $HOME/theos/sdks-repo
        mkdir -p $HOME/theos/sdks
        cp -r $HOME/theos/sdks-repo/iPhoneOS14.5.sdk $HOME/theos/sdks/
        rm -rf $HOME/theos/sdks-repo

    - name: 4. 安装签名工具
      run: |
        brew install ldid

    - name: 5. 写入 control
      run: |
        cat << 'EOF' > control
        Package: com.wemomo.momoappdemo1.tweak
        Name: MomoFloatingButton
        Depends: mobilesubstrate
        Version: 0.0.4
        Architecture: iphoneos-arm
        Description: Momo App 悬浮窗插件 (功能开发版)
        Maintainer: daocaobushicao
        Author: daocaobushicao
        EOF

    - name: 6. 写入 Makefile
      run: |
        cat << 'EOF' > Makefile
        TARGET := iphone:clang:latest:13.0
        INSTALL_TARGET_PROCESSES := Momo
        ARCHS = arm64 arm64e

        include $(THEOS)/makefiles/common.mk

        TWEAK_NAME := MomoFloatingButton
        MomoFloatingButton_FILES := Tweak.x
        MomoFloatingButton_CFLAGS := -fobjc-arc -Wno-error
        MomoFloatingButton_FRAMEWORKS := UIKit CoreGraphics

        include $(THEOS)/makefiles/tweak.mk
        EOF

    - name: 7. 写入 MomoFloatingButton.plist
      run: |
        cat << 'EOF' > MomoFloatingButton.plist
        { Filter = { Bundles = ( "com.wemomo.momoappdemo1" ); }; }
        EOF

    - name: 8. 写入 Tweak.x (原生强挂载：手势完好，预留功能接口)
      run: |
        cat << 'EOF' > Tweak.x
        #import <UIKit/UIKit.h>

        // 全局静态变量，确保全局唯一
        static UIButton *globalMomoPureButton = nil;

        @interface MomoGestureHandler : NSObject
        + (void)handlePan:(UIPanGestureRecognizer *)pan;
        + (void)buttonClicked;
        @end

        @implementation MomoGestureHandler

        // ==========================================
        // 🚀 核心点击事件：后续你的自动化功能代码直接加在这里！
        // ==========================================
        + (void)buttonClicked {
            // 1. 获取当前正在最前面显示的 Window
            UIWindow *keyWindow = nil;
            if (@available(iOS 13.0, *)) {
                for (UIWindowScene *scene in [UIApplication sharedApplication].connectedScenes) {
                    if (scene.activationState == UISceneActivationStateForegroundActive) {
                        for (UIWindow *window in scene.windows) {
                            if (window.isKeyWindow) {
                                keyWindow = window;
                                break;
                            }
                        }
                    }
                }
            }
            if (!keyWindow) keyWindow = [[[UIApplication sharedApplication] windows] firstObject];
            
            // 2. 找到最顶层的控制器，用来安全弹窗
            UIViewController *topController = keyWindow.rootViewController;
            while (topController.presentedViewController) {
                topController = topController.presentedViewController;
            }

            // 3. 弹出响应提示
            UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"Momo 功能面板"
                                                                           message:@"悬浮球响应成功！\n当前处于原始机型安全环境。\n\n请在 Tweak.x 的 buttonClicked 方法中添加你的自动化或劫持业务逻辑。"
                                                                    preferredStyle:UIAlertControllerStyleAlert];
            [alert addAction:[UIAlertAction actionWithTitle:@"收到" style:UIAlertActionStyleDefault handler:nil]];
            [topController presentViewController:alert animated:YES completion:nil];
        }

        // ==========================================
        // ✋ 核心滑动事件：完美平滑拖拽，防止出界
        // ==========================================
        + (void)handlePan:(UIPanGestureRecognizer *)pan {
            UIView *button = pan.view;
            CGPoint translation = [pan translationInView:button.superview];
            CGPoint newCenter = CGPointMake(button.center.x + translation.x, button.center.y + translation.y);
            
            CGSize screenSize = [UIScreen mainScreen].bounds.size;
            
            // 边缘保护（上下左右各留安全距离）
            if (newCenter.x >= 27 && newCenter.x <= screenSize.width - 27 &&
                newCenter.y >= 40 && newCenter.y <= screenSize.height - 40) {
                button.center = newCenter;
            }
            [pan setTranslation:CGPointZero inView:button.superview];
        }
        @end

        // ==========================================
        // 💉 视图注入生命周期 Hook
        // ==========================================
        %hook UIViewController

        - (void)viewDidAppear:(BOOL)animated {
            %orig(animated);

            // 核心过滤：只在全屏的主页面视图上挂载悬浮球，避免在小弹窗、键盘上重复挂载
            if (self.view.frame.size.width == [UIScreen mainScreen].bounds.size.width && 
                self.view.frame.size.height == [UIScreen mainScreen].bounds.size.height) {
                
                UIWindow *mainTargetWindow = nil;
                if (@available(iOS 13.0, *)) {
                    for (UIWindowScene *scene in [UIApplication sharedApplication].connectedScenes) {
                        if (scene.activationState == UISceneActivationStateForegroundActive) {
                            for (UIWindow *window in scene.windows) {
                                if (window.isKeyWindow) {
                                    mainTargetWindow = window;
                                    break;
                                }
                            }
                        }
                    }
                }
                if (!mainTargetWindow) mainTargetWindow = [[[UIApplication sharedApplication] windows] firstObject];
                
                // 如果找到了主 Window，且悬浮球还没创建
                if (mainTargetWindow && !globalMomoPureButton) {
                    
                    // 初始化 55x55 圆形按钮
                    globalMomoPureButton = [UIButton buttonWithType:UIButtonTypeCustom];
                    globalMomoPureButton.frame = CGRectMake(20, 300, 55, 55);
                    globalMomoPureButton.backgroundColor = [UIColor systemBlueColor];
                    globalMomoPureButton.layer.cornerRadius = 55 / 2.0;
                    
                    // 添加精致的阴影，让它更有质感
                    globalMomoPureButton.layer.shadowColor = [UIColor blackColor].CGColor;
                    globalMomoPureButton.layer.shadowOffset = CGSizeMake(0, 3);
                    globalMomoPureButton.layer.shadowOpacity = 0.4;
                    globalMomoPureButton.layer.shadowRadius = 4;
                    
                    [globalMomoPureButton setTitle:@"M" forState:UIControlStateNormal];
                    [globalMomoPureButton setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                    globalMomoPureButton.titleLabel.font = [UIFont boldSystemFontOfSize:22];
                    
                    // 绑定一键点击事件
                    [globalMomoPureButton addTarget:[MomoGestureHandler class] 
                                             action:@selector(buttonClicked) 
                                   forControlEvents:UIControlEventTouchUpInside];
                    
                    // 绑定拖动手势
                    UIPanGestureRecognizer *panGesture = [[UIPanGestureRecognizer alloc] initWithTarget:[MomoGestureHandler class] 
                                                                                                 action:@selector(handlePan:)];
                    [globalMomoPureButton addGestureRecognizer:panGesture];
                    
                    // 强行插入到主 Window 的最顶层视图
                    [mainTargetWindow addSubview:globalMomoPureButton];
                    NSLog(@"[MomoTweak] 功能版悬浮球已完美挂载到 Window 最顶层！");
                }
            }
        }
        %end
        EOF

    - name: 9. 执行打包
      run: |
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        make package FINALPACKAGE=1
        
    - name: 10. 上传成品
      uses: actions/upload-artifact@v4
      with:
        name: MomoTweak-Release-Deb
        path: packages/*.deb
