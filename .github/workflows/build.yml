name: iOS Tweak Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 配置 Theos 环境
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        
    - name: 3. 配置 SDK
      run: |
        git clone https://github.com/theos/sdks.git $HOME/theos/sdks-repo
        mkdir -p $HOME/theos/sdks
        cp -r $HOME/theos/sdks-repo/iPhoneOS14.5.sdk $HOME/theos/sdks/
        rm -rf $HOME/theos/sdks-repo

    - name: 4. 安装签名工具
      run: |
        brew install ldid

    - name: 5. 写入 control 文件
      run: |
        cat << 'EOF' > control
        Package: com.wemomo.momoappdemo1.tweak
        Name: MomoVPNController
        Depends: mobilesubstrate
        Version: 0.0.13
        Architecture: iphoneos-arm
        Description: Momo App 悬浮球 (带连接状态精准同步版)
        Maintainer: daocaobushicao
        Author: daocaobushicao
        EOF

    - name: 6. 写入 Makefile (移除了容易引发冲突的 SystemConfiguration 框架)
      run: |
        cat << 'EOF' > Makefile
        TARGET := iphone:clang:latest:13.0
        INSTALL_TARGET_PROCESSES := Momo SpringBoard
        ARCHS = arm64 arm64e

        include $(THEOS)/makefiles/common.mk

        TWEAK_NAME := MomoVPNController
        MomoVPNController_FILES := Tweak.x
        MomoVPNController_CFLAGS := -fobjc-arc -Wno-error
        MomoVPNController_FRAMEWORKS := UIKit CoreGraphics

        include $(THEOS)/makefiles/tweak.mk
        EOF

    - name: 7. 写入 MomoVPNController.plist
      run: |
        cat << 'EOF' > MomoVPNController.plist
        { Filter = { Bundles = ( "com.wemomo.momoappdemo1", "com.apple.springboard" ); }; }
        EOF

    - name: 8. 写入 Tweak.x (完全重构版：纯净网卡检测 + UI 锁死机制)
      run: |
        cat << 'EOF' > Tweak.x
        #import <UIKit/UIKit.h>
        #import <spawn.h>
        #import <unistd.h>
        #import <sys/socket.h>
        #import <net/if.h>

        extern char **environ;

        // Darwin 跨进程通知总线
        #define kVPNStartNotification "com.wemomo.vpn.start"
        #define kVPNStopNotification "com.wemomo.vpn.stop"
        #define kVPNStatusConnectedNotification "com.wemomo.vpn.status.connected"
        #define kVPNStatusDisconnectedNotification "com.wemomo.vpn.status.disconnected"

        static UIButton *globalMomoPureButton = nil;
        static BOOL isVPNConnected = NO;

        // =========================================================================
        // 🧱 模块一：桌面特权进程 (SpringBoard) 后台检测与下发指令
        // =========================================================================

        // 使用底层 POSIX 标准网络接口判断是否有处于激活状态的 utun 网卡 (iOS VPN 普遍使用的虚拟网卡)
        // 从而完美避开 SystemConfiguration 在跨进程编译时的各种恶心报错
        static BOOL checkSystemVPNActiveViaNet() {
            BOOL active = NO;
            struct if_nameindex *if_ni, *i;
            if_ni = if_nameindex();
            if (if_ni != NULL) {
                for (i = if_ni; ! (i->if_index == 0 && i->if_name == NULL); i++) {
                    // 一般 L2TP/IPSec 拨号成功后会生成 utun0, utun1, utun2 等网卡
                    if (strstr(i->if_name, "utun") != NULL) {
                        active = YES;
                        break;
                    }
                }
                if_nameindex_free(if_ni);
            }
            return active;
        }

        // 高频网卡通路探测器
        static void startPollingVPNStatus(BOOL targetState, int remainingRetries) {
            if (remainingRetries <= 0) return;
            
            dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.5 * NSEC_PER_SEC)), dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{
                BOOL isExist = checkSystemVPNActiveViaNet();
                if (isExist == targetState) {
                    if (targetState) {
                        CFNotificationCenterPostNotification(CFNotificationCenterGetDarwinNotifyCenter(), CFSTR(kVPNStatusConnectedNotification), NULL, NULL, YES);
                    } else {
                        CFNotificationCenterPostNotification(CFNotificationCenterGetDarwinNotifyCenter(), CFSTR(kVPNStatusDisconnectedNotification), NULL, NULL, YES);
                    }
                } else {
                    startPollingVPNStatus(targetState, remainingRetries - 1);
                }
            });
        }

        static void onSpringBoardReceiveStart(CFNotificationCenterRef center, void *observer, CFStringRef name, const void *object, CFDictionaryRef userInfo) {
            pid_t pid;
            const char *args[] = {"/usr/sbin/scutil", "--nc", "start", "vpn", NULL};
            posix_spawn(&pid, "/usr/sbin/scutil", NULL, NULL, (char* const*)args, environ);
            
            // 开始轮询：最大等待 15 秒（30次 * 0.5秒）
            startPollingVPNStatus(YES, 30);
        }

        static void onSpringBoardReceiveStop(CFNotificationCenterRef center, void *observer, CFStringRef name, const void *object, CFDictionaryRef userInfo) {
            pid_t pid;
            const char *args[] = {"/usr/sbin/scutil", "--nc", "stop", "vpn", NULL};
            posix_spawn(&pid, "/usr/sbin/scutil", NULL, NULL, (char* const*)args, environ);
            
            startPollingVPNStatus(NO, 20);
        }

        // =========================================================================
        // 📱 模块二：沙盒进程 (Momo) UI 控制链
        // =========================================================================
        @interface MomoVPNCommandHandler : NSObject
        + (void)handlePan:(UIPanGestureRecognizer *)pan;
        + (void)toggleVPNState:(UIButton *)button;
        @end

        @implementation MomoVPNCommandHandler

        + (void)toggleVPNState:(UIButton *)button {
            // 🔒 【核心安全锁】一碰瞬间卡死点击，绝不给自动化脚本狂戳和二次触发的机会
            button.userInteractionEnabled = NO;
            
            if (!isVPNConnected) {
                // 1. 瞬间转换为橙黄色、文字变成 M(⌛)
                [button setTitle:@"M(⌛)" forState:UIControlStateNormal];
                button.backgroundColor = [UIColor systemOrangeColor];
                
                // 2. 注入平滑的循环呼吸动画，提示后台正在紧张连接中
                [UIView animateWithDuration:0.4 delay:0 options:UIViewAnimationOptionAutoreverse | UIViewAnimationOptionRepeat animations:^{
                    button.alpha = 0.5;
                } completion:nil];
                
                // 3. 跨进程发射通知
                CFNotificationCenterPostNotification(CFNotificationCenterGetDarwinNotifyCenter(), CFSTR(kVPNStartNotification), NULL, NULL, YES);
            } else {
                // 断开过渡期变为灰色
                [button setTitle:@"M(断)" forState:UIControlStateNormal];
                button.backgroundColor = [UIColor systemGrayColor];
                
                CFNotificationCenterPostNotification(CFNotificationCenterGetDarwinNotifyCenter(), CFSTR(kVPNStopNotification), NULL, NULL, YES);
            }
        }

        + (void)handlePan:(UIPanGestureRecognizer *)pan {
            UIView *button = pan.view;
            CGPoint translation = [pan translationInView:button.superview];
            CGPoint newCenter = CGPointMake(button.center.x + translation.x, button.center.y + translation.y);
            CGSize screenSize = [UIScreen mainScreen].bounds.size;
            if (newCenter.x >= 32 && newCenter.x <= screenSize.width - 32 &&
                newCenter.y >= 40 && newCenter.y <= screenSize.height - 40) {
                button.center = newCenter;
            }
            [pan setTranslation:CGPointZero inView:button.superview];
        }
        @end

        // 🟢 监听到真正拨号连通：移除闪烁、彻底变绿、放开点击权限
        static void onMomoReceivedConnected(CFNotificationCenterRef center, void *observer, CFStringRef name, const void *object, CFDictionaryRef userInfo) {
            dispatch_async(dispatch_get_main_queue(), ^{
                if (globalMomoPureButton) {
                    [globalMomoPureButton.layer removeAllAnimations];
                    globalMomoPureButton.alpha = 1.0;
                    
                    isVPNConnected = YES;
                    globalMomoPureButton.userInteractionEnabled = YES; // 🔓 恢复点击权限
                    [globalMomoPureButton setTitle:@"M(开)" forState:UIControlStateNormal];
                    globalMomoPureButton.backgroundColor = [UIColor systemGreenColor];
                }
            });
        }

        // 🔴 监听到断开成功：移除闪烁、重置为初始蓝色、放开点击权限
        static void onMomoReceivedDisconnected(CFNotificationCenterRef center, void *observer, CFStringRef name, const void *object, CFDictionaryRef userInfo) {
            dispatch_async(dispatch_get_main_queue(), ^{
                if (globalMomoPureButton) {
                    [globalMomoPureButton.layer removeAllAnimations];
                    globalMomoPureButton.alpha = 1.0;
                    
                    isVPNConnected = NO;
                    globalMomoPureButton.userInteractionEnabled = YES; // 🔓 恢复点击权限
                    [globalMomoPureButton setTitle:@"M(关)" forState:UIControlStateNormal];
                    globalMomoPureButton.backgroundColor = [UIColor systemBlueColor];
                }
            });
        }

        // =========================================================================
        // 💉 Logos 挂钩注入核心块 (严格保证 UIHook 块在 %ctor 上方，防止宏解析出错)
        // =========================================================================
        %group MomoUIHook
        %hook UIViewController
        - (void)viewDidAppear:(BOOL)animated {
            %orig(animated);
            if (self.view.frame.size.width == [UIScreen mainScreen].bounds.size.width && 
                self.view.frame.size.height == [UIScreen mainScreen].bounds.size.height) {
                
                UIWindow *mainTargetWindow = nil;
                if (@available(iOS 13.0, *)) {
                    for (UIWindowScene *scene in [UIApplication sharedApplication].connectedScenes) {
                        if (scene.activationState == UISceneActivationStateForegroundActive) {
                            for (UIWindow *window in scene.windows) {
                                if (window.isKeyWindow) {
                                    mainTargetWindow = window;
                                    break;
                                }
                            }
                        }
                    }
                }
                if (!mainTargetWindow) mainTargetWindow = [[[UIApplication sharedApplication] windows] firstObject];
                
                if (mainTargetWindow && !globalMomoPureButton) {
                    globalMomoPureButton = [UIButton buttonWithType:UIButtonTypeCustom];
                    globalMomoPureButton.frame = CGRectMake(20, 300, 65, 55);
                    globalMomoPureButton.backgroundColor = [UIColor systemBlueColor]; 
                    globalMomoPureButton.layer.cornerRadius = 55 / 2.0;
                    
                    globalMomoPureButton.layer.shadowColor = [UIColor blackColor].CGColor;
                    globalMomoPureButton.layer.shadowOffset = CGSizeMake(0, 3);
                    globalMomoPureButton.layer.shadowOpacity = 0.4;
                    globalMomoPureButton.layer.shadowRadius = 4;
                    
                    [globalMomoPureButton setTitle:@"M(关)" forState:UIControlStateNormal];
                    [globalMomoPureButton setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                    globalMomoPureButton.titleLabel.font = [UIFont boldSystemFontOfSize:15];
                    
                    [globalMomoPureButton addTarget:[MomoVPNCommandHandler class] action:@selector(toggleVPNState:) forControlEvents:UIControlEventTouchUpInside];
                    UIPanGestureRecognizer *panGesture = [[UIPanGestureRecognizer alloc] initWithTarget:[MomoVPNCommandHandler class] action:@selector(handlePan:)];
                    [globalMomoPureButton addGestureRecognizer:panGesture];
                    
                    [mainTargetWindow addSubview:globalMomoPureButton];
                }
            }
        }
        %end
        %end

        %ctor {
            NSString *bundleID = [[NSBundle mainBundle] bundleIdentifier];
            
            if ([bundleID isEqualToString:@"com.apple.springboard"]) {
                // 桌面进程上下文：绑定系统特权级 Darwin 硬件控制回调
                CFNotificationCenterAddObserver(CFNotificationCenterGetDarwinNotifyCenter(), NULL, onSpringBoardReceiveStart, CFSTR(kVPNStartNotification), NULL, CFNotificationSuspensionBehaviorDeliverImmediately);
                CFNotificationCenterAddObserver(CFNotificationCenterGetDarwinNotifyCenter(), NULL, onSpringBoardReceiveStop, CFSTR(kVPNStopNotification), NULL, CFNotificationSuspensionBehaviorDeliverImmediately);
            } 
            else if ([bundleID isEqualToString:@"com.wemomo.momoappdemo1"]) {
                // 沙盒应用上下文：绑定反向状态回传总线
                CFNotificationCenterAddObserver(CFNotificationCenterGetDarwinNotifyCenter(), NULL, onMomoReceivedConnected, CFSTR(kVPNStatusConnectedNotification), NULL, CFNotificationSuspensionBehaviorDeliverImmediately);
                CFNotificationCenterAddObserver(CFNotificationCenterGetDarwinNotifyCenter(), NULL, onMomoReceivedDisconnected, CFSTR(kVPNStatusDisconnectedNotification), NULL, CFNotificationSuspensionBehaviorDeliverImmediately);
                
                %init(MomoUIHook);
            }
        }
        EOF

    - name: 9. 执行打包
      run: |
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        make clean
        make package FINALPACKAGE=1
        
    - name: 10. 上传成品
      uses: actions/upload-artifact@v4
      with:
        name: MomoVPNController-Release-Deb
        path: |
          packages/*.deb
          *.deb
