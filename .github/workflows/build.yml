name: iOS Tweak Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 配置 Theos 环境
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        
    - name: 3. 配置 SDK
      run: |
        git clone https://github.com/theos/sdks.git $HOME/theos/sdks-repo
        mkdir -p $HOME/theos/sdks
        cp -r $HOME/theos/sdks-repo/iPhoneOS14.5.sdk $HOME/theos/sdks/
        rm -rf $HOME/theos/sdks-repo

    - name: 4. 安装签名工具
      run: |
        brew install ldid

    - name: 5. 写入 control
      run: |
        cat << 'EOF' > control
        Package: com.wemomo.momoappdemo1.tweak
        Name: MomoFloatingButton
        Depends: mobilesubstrate
        Version: 0.0.1
        Architecture: iphoneos-arm64
        Description: Momo App 悬浮窗插件 (系统层兼容版)
        Maintainer: daocaobushicao
        Author: daocaobushicao
        EOF

    - name: 6. 写入 Makefile
      run: |
        cat << 'EOF' > Makefile
        TARGET := iphone:clang:latest:13.0
        INSTALL_TARGET_PROCESSES := Momo
        ARCHS = arm64 arm64e

        include $(THEOS)/makefiles/common.mk

        TWEAK_NAME := MomoFloatingButton
        MomoFloatingButton_FILES := Tweak.x
        MomoFloatingButton_CFLAGS := -fobjc-arc -Wno-error
        MomoFloatingButton_FRAMEWORKS := UIKit CoreGraphics

        include $(THEOS)/makefiles/tweak.mk
        EOF

    - name: 7. 写入 MomoFloatingButton.plist (包名死锁)
      run: |
        cat << 'EOF' > MomoFloatingButton.plist
        { Filter = { Bundles = ( "com.wemomo.momoappdemo1" ); }; }
        EOF

    - name: 8. 写入 Tweak.x (底层核心类注入 - 强袭版)
      run: |
        cat << 'EOF' > Tweak.x
        #import <UIKit/UIKit.h>

        // 自定义悬浮窗
        @interface MomoSystemFloatingWindow : UIWindow
        @property (nonatomic, strong) UIButton *button;
        @end

        @implementation MomoSystemFloatingWindow

        - (instancetype)initWithFrame:(CGRect)frame {
            self = [super initWithFrame:frame];
            if (self) {
                // 强制将层级开到最高，压在所有改机软件和系统 UI 之上
                self.windowLevel = UIWindowLevelStatusBar + 9999;
                self.backgroundColor = [UIColor clearColor];
                
                self.button = [UIButton buttonWithType:UIButtonTypeCustom];
                self.button.frame = self.bounds;
                self.button.backgroundColor = [UIColor systemBlueColor];
                self.button.layer.cornerRadius = frame.size.width / 2;
                [self.button setTitle:@"M" forState:UIControlStateNormal];
                [self.button setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                self.button.titleLabel.font = [UIFont boldSystemFontOfSize:20];
                
                self.button.layer.shadowColor = [UIColor blackColor].CGColor;
                self.button.layer.shadowOffset = CGSizeMake(0, 2);
                self.button.layer.shadowOpacity = 0.4;
                self.button.layer.shadowRadius = 4;
                
                [self.button addTarget:self action:@selector(buttonClicked) forControlEvents:UIControlEventTouchUpInside];
                UIPanGestureRecognizer *pan = [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(handlePan:)];
                [self.button addGestureRecognizer:pan];
                
                [self addSubview:self.button];
            }
            return self;
        }

        - (void)buttonClicked {
            // 安全弹窗逻辑
            UIWindow *frontWindow = [[[UIApplication sharedApplication] windows] firstObject];
            UIViewController *topController = frontWindow.rootViewController;
            while (topController.presentedViewController) {
                topController = topController.presentedViewController;
            }

            UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"Momo 助手"
                                                                           message:@"环境冲突已成功绕过，悬浮球加载成功！"
                                                                    preferredStyle:UIAlertControllerStyleAlert];
            [alert addAction:[UIAlertAction actionWithTitle:@"确定" style:UIAlertActionStyleDefault handler:nil]];
            [topController presentViewController:alert animated:YES completion:nil];
        }

        - (void)handlePan:(UIPanGestureRecognizer *)pan {
            CGPoint translation = [pan translationInView:self];
            CGPoint newCenter = CGPointMake(self.center.x + translation.x, self.center.y + translation.y);
            CGSize screenSize = [UIScreen mainScreen].bounds.size;
            
            if (newCenter.x >= 25 && newCenter.x <= screenSize.width - 25 &&
                newCenter.y >= 40 && newCenter.y <= screenSize.height - 40) {
                self.center = newCenter;
            }
            [pan setTranslation:CGPointZero inView:self];
        }
        @end

        static MomoSystemFloatingWindow *globalMomoWindow = nil;

        // 核心修改：放弃对陌陌内部类的Hook，直接Hook苹果系统的 UIApplication
        %hook UIApplication

        - (instancetype)init {
            id original = %orig;
            if (original) {
                // 监听系统自带的通知，App 一准备好就立刻执行
                [[NSNotificationCenter defaultCenter] addObserverForName:UIApplicationDidFinishLaunchingNotification 
                                                                  object:nil 
                                                                   queue:[NSOperationQueue mainQueue] 
                                                              usingBlock:^(NSNotification *note) {
                    if (!globalMomoWindow) {
                        UIWindow *keyWin = [[[UIApplication sharedApplication] windows] firstObject];
                        if (keyWin && keyWin.windowScene) {
                            globalMomoWindow = [[MomoSystemFloatingWindow alloc] initWithFrame:CGRectMake(30, 200, 55, 55)];
                            globalMomoWindow.windowScene = keyWin.windowScene;
                            globalMomoWindow.rootViewController = [[UIViewController alloc] init];
                            globalMomoWindow.hidden = NO;
                            NSLog(@"[MomoTweak] 通过系统层成功突破 AMG 改机软件拦截！");
                        }
                    }
                }];
            }
            return original;
        }
        %end
        EOF

    - name: 9. 执行打包
      run: |
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        make package FINALPACKAGE=1
        
    - name: 10. 上传成品
      uses: actions/upload-artifact@v4
      with:
        name: MomoTweak-Release-Deb
        path: packages/*.deb
