name: iOS Tweak Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 1. 检出用户代码
      uses: actions/checkout@v4

    - name: 2. 自动化配置标准的 Theos 全套环境
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        
    - name: 3. 精准注入 13.6 SDK
      run: |
        git clone https://github.com/theos/sdks.git $HOME/theos/sdks-repo
        mkdir -p $HOME/theos/sdks
        cp -r $HOME/theos/sdks-repo/iPhoneOS13.6.sdk $HOME/theos/sdks/
        rm -rf $HOME/theos/sdks-repo

    - name: 4. 确保 Makefile 拥有标准的交叉编译架构声明
      run: |
        # 用 sed 替换已有的 ARCHS 和 TARGET 行，而不是追加
        sed -i '' 's/^ARCHS :=.*$/ARCHS = arm64 arm64e/' Makefile || true
        sed -i '' 's/^TARGET :=.*$/TARGET = iphone:clang:13.6:13.0/' Makefile || true

    - name: 5. 绑定全局变量并执行原生 Mac 打包
      run: |
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        make package FINALPACKAGE=1
        
    - name: 6. 提炼成品 .deb 并上传
      uses: actions/upload-artifact@v4
      with:
        name: MomoTweak-Release-Deb
        path: packages/*.deb
