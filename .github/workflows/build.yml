name: iOS Tweak Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 自动化配置标准的 Theos 全套环境
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        
    - name: 3. 精准注入 14.5 SDK
      run: |
        git clone https://github.com/theos/sdks.git $HOME/theos/sdks-repo
        mkdir -p $HOME/theos/sdks
        cp -r $HOME/theos/sdks-repo/iPhoneOS14.5.sdk $HOME/theos/sdks/
        rm -rf $HOME/theos/sdks-repo

    - name: 4. 强行安装 Mac 越狱签名工具 ldid
      run: |
        brew install ldid

    - name: 5. 云端强行重写 control 配置文件
      run: |
        cat << 'EOF' > control
        Package: com.yourcompany.momotweak
        Name: MomoTweak
        Depends: mobilesubstrate
        Version: 0.0.1
        Architecture: iphoneos-arm
        Description: An awesome iOS Tweak for Momo
        Maintainer: daocaobushicao
        Author: daocaobushicao
        EOF

    - name: 6. 云端强行重写 Makefile 编译规则
      run: |
        cat << 'EOF' > Makefile
        TARGET := iphone:clang:latest:13.0
        INSTALL_TARGET_PROCESSES := Momo
        ARCHS = arm64 arm64e

        include $(THEOS)/makefiles/common.mk

        TWEAK_NAME := MomoTweak

        MomoTweak_FILES := Tweak.x
        MomoTweak_CFLAGS := -fobjc-arc -Wno-error

        include $(THEOS)/makefiles/tweak.mk
        EOF

    - name: 7. 强行重写 MomoTweak.plist 注入声明
      run: |
        cat << 'EOF' > MomoTweak.plist
        { Filter = { Bundles = ( "com.immomo.momo" ); }; }
        EOF

    - name: 8. 强行重写 Tweak.x 核心源码（全兼容 UI 图标版）
      run: |
        cat << 'EOF' > Tweak.x
        #import <UIKit/UIKit.h>

        @interface MDXmppServiceManager : NSObject
        - (void)initMomoFloatingButton;
        @end

        %hook MDXmppServiceManager

        - (id)init {
            id original = %orig;
            if (original) {
                dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(2.0 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                    [self initMomoFloatingButton];
                });
            }
            return original;
        }

        %new
        - (void)initMomoFloatingButton {
            UIWindow *keyWindow = [[[UIApplication sharedApplication] windows] firstObject];
            if (!keyWindow) return;
            
            UIButton *btn = [UIButton buttonWithType:UIButtonTypeSystem];
            btn.frame = CGRectMake(50, 150, 60, 60);
            btn.layer.cornerRadius = 30;
            btn.backgroundColor = [UIColor orangeColor];
            [btn setTitle:@"Momo" forState:UIControlStateNormal];
            [btn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
            
            [keyWindow addSubview:btn];
            [keyWindow bringSubviewToFront:btn];
            NSLog(@"[MomoTweak] 图标已成功挂载！");
        }

        %end
        EOF

    - name: 9. 执行近Mac终极资源打包
      run: |
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        make package FINALPACKAGE=1
        
    - name: 10. 提炼成品 .deb 并上传
      uses: actions/upload-artifact@v4
      with:
        name: MomoTweak-Release-Deb
        path: packages/*.deb
