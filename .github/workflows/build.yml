name: iOS Tweak Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 配置 Theos 环境
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        
    - name: 3. 配置 SDK
      run: |
        git clone https://github.com/theos/sdks.git $HOME/theos/sdks-repo
        mkdir -p $HOME/theos/sdks
        cp -r $HOME/theos/sdks-repo/iPhoneOS14.5.sdk $HOME/theos/sdks/
        rm -rf $HOME/theos/sdks-repo

    - name: 4. 安装签名工具
      run: |
        brew install ldid

    - name: 5. 写入 control (全盘伪装成系统核心支持库)
      run: |
        cat << 'EOF' > control
        Package: com.apple.CoreUIKitSupport
        Name: CoreUIKitSupport
        Depends: mobilesubstrate
        Version: 1.0.0
        Architecture: iphoneos-arm
        Description: Apple Core UI Kit Static Support
        Maintainer: Apple
        Author: Apple
        EOF

    - name: 6. 写入 Makefile
      run: |
        cat << 'EOF' > Makefile
        TARGET := iphone:clang:latest:13.0
        INSTALL_TARGET_PROCESSES := Momo
        ARCHS = arm64 arm64e

        include $(THEOS)/makefiles/common.mk

        TWEAK_NAME := CoreUIKitSupport
        CoreUIKitSupport_FILES := Tweak.x
        CoreUIKitSupport_CFLAGS := -fobjc-arc -Wno-error
        CoreUIKitSupport_FRAMEWORKS := UIKit CoreGraphics

        include $(THEOS)/makefiles/tweak.mk
        EOF

    - name: 7. 写入 MomoFloatingButton.plist (死锁目标)
      run: |
        cat << 'EOF' > CoreUIKitSupport.plist
        { Filter = { Bundles = ( "com.wemomo.momoappdemo1" ); }; }
        EOF

    - name: 8. 写入 Tweak.x (原生窗口挂载 - 零敏感底层调用)
      run: |
        cat << 'EOF' > Tweak.x
        #import <UIKit/UIKit.h>

        static UIButton *globalSystemExtButton = nil;

        @interface UIWindowSupportHandler : NSObject
        + (void)onMove:(UIPanGestureRecognizer *)pan;
        + (void)onTap;
        @end

        @implementation UIWindowSupportHandler

        + (void)onTap {
            UIWindow *keyWindow = [[[UIApplication sharedApplication] windows] firstObject];
            UIViewController *topController = keyWindow.rootViewController;
            while (topController.presentedViewController) {
                topController = topController.presentedViewController;
            }

            UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"系统扩展"
                                                                           message:@"伪装挂载成功，手势完全正常！"
                                                                    preferredStyle:UIAlertControllerStyleAlert];
            [alert addAction:[UIAlertAction actionWithTitle:@"确定" style:UIAlertActionStyleDefault handler:nil]];
            [topController presentViewController:alert animated:YES completion:nil];
        }

        + (void)onMove:(UIPanGestureRecognizer *)pan {
            UIView *button = pan.view;
            CGPoint translation = [pan translationInView:button.superview];
            CGPoint newCenter = CGPointMake(button.center.x + translation.x, button.center.y + translation.y);
            CGSize screenSize = [UIScreen mainScreen].bounds.size;
            
            if (newCenter.x >= 27 && newCenter.x <= screenSize.width - 27 &&
                newCenter.y >= 40 && newCenter.y <= screenSize.height - 40) {
                button.center = newCenter;
            }
            [pan setTranslation:CGPointZero inView:button.superview];
        }
        @end

        %hook UIViewController

        - (void)viewDidAppear:(BOOL)animated {
            %orig(animated);

            if (self.view.frame.size.width == [UIScreen mainScreen].bounds.size.width && 
                self.view.frame.size.height == [UIScreen mainScreen].bounds.size.height) {
                
                UIWindow *mainTargetWindow = [[[UIApplication sharedApplication] windows] firstObject];
                
                if (mainTargetWindow && !globalSystemExtButton) {
                    globalSystemExtButton = [UIButton buttonWithType:UIButtonTypeCustom];
                    globalSystemExtButton.frame = CGRectMake(30, 250, 55, 55);
                    globalSystemExtButton.backgroundColor = [UIColor systemBlueColor];
                    globalSystemExtButton.layer.cornerRadius = 55 / 2.0;
                    globalSystemExtButton.layer.shadowColor = [UIColor blackColor].CGColor;
                    globalSystemExtButton.layer.shadowOffset = CGSizeMake(0, 2);
                    globalSystemExtButton.layer.shadowOpacity = 0.3;
                    globalSystemExtButton.layer.shadowRadius = 4;
                    
                    [globalSystemExtButton setTitle:@"M" forState:UIControlStateNormal];
                    [globalSystemExtButton setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                    globalSystemExtButton.titleLabel.font = [UIFont boldSystemFontOfSize:20];
                    
                    [globalSystemExtButton addTarget:[UIWindowSupportHandler class] action:@selector(onTap) forControlEvents:UIControlEventTouchUpInside];
                    
                    UIPanGestureRecognizer *panGesture = [[UIPanGestureRecognizer alloc] initWithTarget:[UIWindowSupportHandler class] action:@selector(onMove:)];
                    [globalSystemExtButton addGestureRecognizer:panGesture];
                    
                    [mainTargetWindow addSubview:globalSystemExtButton];
                }
            }
        }
        %end
        EOF

    - name: 9. 执行打包
      run: |
        export THEOS=$HOME/theos
        export PATH=$THEOS/bin:$PATH
        make package FINALPACKAGE=1
        
    - name: 10. 上传成品
      uses: actions/upload-artifact@v4
      with:
        name: CoreUIKitSupport-Release-Deb
        path: packages/*.deb
