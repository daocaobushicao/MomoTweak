name: iOS Tweak Build

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Project
      uses: actions/checkout@v4

    - name: Setup Theos 环境
      uses: theos/setup-theos@v1
      with:
        theos-src: https://github.com/theos/theos.git

    - name: 塞入 13.6 SDK
      run: |
        git clone https://github.com/theos/sdks.git $THEOS/sdks-repo
        cp -r $THEOS/sdks-repo/iPhoneOS13.6.sdk $THEOS/sdks/

    - name: 开始云端极速打包
      run: |
        make package FINALPACKAGE=1

    - name: 导出成品 .deb 文件
      uses: actions/upload-artifact@v4
      with:
        name: MomoTweak-Release-Deb
        path: packages/*.deb